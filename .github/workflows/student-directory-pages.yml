name: Publish Student Directory preview

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/teacher-student-directory-v1.html'
      - 'prototype/teacher-student-directory-v1.1.html'
      - 'prototype/teacher-student-directory-v1.2.html'
      - 'prototype/teacher-student-profile-v1.html'
      - 'prototype/teacher-student-profile-v2.html'
      - 'prototype/class-register.html'
      - 'prototype/history-v1.2.html'
      - '.github/workflows/student-directory-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate prototype JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'prototype/teacher-student-directory-v1.html',
              'prototype/teacher-student-directory-v1.1.html',
              'prototype/teacher-student-directory-v1.2.html',
              'prototype/teacher-student-profile-v1.html',
              'prototype/teacher-student-profile-v2.html',
              'prototype/class-register.html',
              'prototype/history-v1.2.html',
          ]:
              source = Path(name).read_text()
              script = source.split('<script>', 1)[1].split('</script>', 1)[0]
              Path('/tmp/prototype-check.js').write_text(script)
              import subprocess
              subprocess.run(['node', '--check', '/tmp/prototype-check.js'], check=True)
              print('JavaScript syntax OK:', name)
          directory = Path('prototype/teacher-student-directory-v1.2.html').read_text()
          profile = Path('prototype/teacher-student-profile-v2.html').read_text()
          required_directory = ['function openFullProfile', "onclick=\"openFullProfile(this.dataset.id)\"", 'student-profile.html?studentId=']
          assert all(token in directory for token in required_directory), 'T05 direct profile navigation is incomplete'
          assert 'function showStudent(id)' not in directory, 'T05 quick overview function must be removed'
          assert 'Student overview' not in directory, 'T05 quick overview must be removed'
          required_profile = ["params.get('studentId')", 'directory.students.find', 'function renderEdit()', 'function saveProfile(event)', 'parentInfoEnabled', 'additionalNotes', 'Enter a phone number for every parent / guardian.', 'Additional Notes', 'Shared with assigned teachers']
          assert all(token in profile for token in required_profile), 'T06 profile requirements are incomplete'
          assert profile.count('onclick="editStudent()"') == 1, 'T06 must have one Edit profile action'
          assert 'function editGuardian(id)' not in profile and 'function saveGuardian(id)' not in profile, 'T06 must use unified editing rather than separate guardian edit dialogs'
          import re
          directory_records = dict(re.findall(r"\{id:'(STU-\d{4,})',name:'([^']+)'", directory))
          profile_records = dict(re.findall(r"\{id:'(STU-\d{4,})',name:'([^']+)'", profile))
          assert directory_records == profile_records, 'T05 and T06 seeded Student IDs/names do not match'
          print('T05/T06 direct navigation and seeded student records match')
          PY

      - name: Prepare preview site
        run: |
          mkdir -p _site/prototype
          cp prototype/teacher-student-directory-v1.2.html _site/index.html
          cp prototype/teacher-student-directory-v1.2.html _site/student-directory.html
          cp prototype/teacher-student-profile-v2.html _site/student-profile.html
          cp prototype/class-register.html _site/prototype/class-register.html
          cp prototype/history-v1.2.html _site/prototype/history-v1.2.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
