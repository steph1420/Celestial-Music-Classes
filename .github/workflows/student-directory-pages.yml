name: Publish Student Directory preview

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/teacher-student-directory-v1.html'
      - 'prototype/teacher-student-directory-v1.1.html'
      - 'prototype/teacher-student-profile-v1.html'
      - 'prototype/class-register.html'
      - 'prototype/history-v1.2.html'
      - '.github/workflows/student-directory-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate prototype JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'prototype/teacher-student-directory-v1.html',
              'prototype/teacher-student-directory-v1.1.html',
              'prototype/teacher-student-profile-v1.html',
              'prototype/class-register.html',
              'prototype/history-v1.2.html',
          ]:
              source = Path(name).read_text()
              script = source.split('<script>', 1)[1].split('</script>', 1)[0]
              Path('/tmp/prototype-check.js').write_text(script)
              import subprocess
              subprocess.run(['node', '--check', '/tmp/prototype-check.js'], check=True)
              print('JavaScript syntax OK:', name)
          directory = Path('prototype/teacher-student-directory-v1.1.html').read_text()
          profile = Path('prototype/teacher-student-profile-v1.html').read_text()
          required_directory = ['function openFullProfile', 'Student ID', 'Open full student profile', 'STU-0001']
          required_profile = ["params.get('studentId')", 'directory.students.find', "id:'STU-0001'", "id:'STU-0008'"]
          assert all(token in directory for token in required_directory), 'T05 profile link / Student ID contract is incomplete'
          assert all(token in profile for token in required_profile), 'T06 shared Student ID / directory fallback contract is incomplete'
          import re
          directory_records = dict(re.findall(r"\{id:'(STU-\d{4,})',name:'([^']+)'", directory))
          profile_records = dict(re.findall(r"\{id:'(STU-\d{4,})',name:'([^']+)'", profile))
          assert directory_records == profile_records, 'T05 and T06 seeded Student IDs/names do not match'
          print('T05/T06 seeded student records match')

          node_test = r"""
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('prototype/teacher-student-directory-v1.1.html','utf8');
          const show = source.match(/function showStudent\(id\)\{[\s\S]*?\n\}/);
          const open = source.match(/function openFullProfile\(id\)\{[\s\S]*?\n\}/);
          if (!show || !open) throw new Error('Student overview/profile functions missing');
          let captured;
          const ctx = {
            state: { students: [{id:'STU-0002',name:'Ananya Das',status:'Active',enrolments:[{subject:'Piano'}]}] },
            esc: value => String(value),
            showModal: (...args) => { captured = args; }
          };
          vm.runInNewContext(show[0] + "; showStudent('STU-0002')", ctx);
          if (!captured[2].includes("onclick=\"openFullProfile('STU-0002')\">")) throw new Error('Profile CTA does not carry the selected Student ID');
          const routeContext = {state:ctx.state,closeModal:()=>{},toast:()=>{},window:{location:{}}};
          vm.runInNewContext(open[0] + "; openFullProfile('STU-0002')", routeContext);
          if (!routeContext.window.location.href.includes('studentId=STU-0002')) throw new Error('Profile route lost the selected Student ID');
          console.log('Student overview action passes the selected ID');
          """
          subprocess.run(['node', '-e', node_test], check=True)
          PY

      - name: Prepare preview site
        run: |
          mkdir -p _site/prototype
          cp prototype/teacher-student-directory-v1.1.html _site/index.html
          cp prototype/teacher-student-directory-v1.1.html _site/student-directory.html
          cp prototype/teacher-student-profile-v1.html _site/student-profile.html
          cp prototype/class-register.html _site/prototype/class-register.html
          cp prototype/history-v1.2.html _site/prototype/history-v1.2.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
