name: Publish Student Directory preview

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/teacher-student-directory-v1.html'
      - 'prototype/teacher-student-profile-v1.html'
      - 'prototype/class-register.html'
      - 'prototype/history-v1.2.html'
      - '.github/workflows/student-directory-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare preview site
        run: |
          mkdir -p _site/prototype
          cp prototype/teacher-student-directory-v1.html _site/index.html
          cp prototype/teacher-student-profile-v1.html _site/student-profile.html
          cp prototype/class-register.html _site/prototype/class-register.html
          cp prototype/history-v1.2.html _site/prototype/history-v1.2.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
