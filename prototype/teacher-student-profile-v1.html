/* Celestial: restrained, familiar app styling */
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .16s,color .16s}
.topbar{height:60px;gap:10px;padding:0 clamp(12px,3vw,28px);backdrop-filter:none;background:var(--nav)}
.brand{font:600 19px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.025em}
.top-divider{height:22px}
.top-title{font:500 17px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}
.saved{border-radius:8px;padding:6px 9px;font-size:11px;font-weight:650}
.icon{border-radius:9px;width:36px;height:36px;transition:background .15s,border-color .15s}
.icon:active{transform:scale(.97)}
.layout{max-width:880px;padding:22px clamp(14px,3vw,28px) 100px}
.class-meta{grid-template-columns:1fr 1fr;gap:12px;background:transparent;border:0;padding:0;border-radius:0;box-shadow:none;margin-bottom:18px}
.fieldbox label{font-size:12px;font-weight:600;letter-spacing:0;margin:0 0 7px;color:var(--muted)}
.fieldbox select,.date-input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 12px;outline:none}
.date-input{font-variant-numeric:tabular-nums}
.fieldbox select:focus,.date-input:focus{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 15%,transparent)}
.summary{gap:8px;margin:0 0 20px}
.stat{border-radius:8px;padding:9px 8px;font-size:12px;font-weight:650}
.list-head{margin:0 1px 9px}
.list-head strong{font-size:15px;font-weight:650}
.hint{font-size:12px}
.student-list{gap:0;border-top:1px solid var(--line)}
.student{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--surface);padding:12px 10px;min-height:68px;gap:10px}
.student:active{transform:none;background:var(--surface2)}
.student.selected{border-color:var(--line);background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.avatar{display:none}
.student-name{font-weight:600;font-size:14px}
.student-sub{font-size:11px;margin-top:2px}
.status{border-radius:8px;min-width:98px;padding:8px 9px;font-size:12px;font-weight:600}
.arrow{font-size:19px}
.check{border-radius:5px}
.bulkbar{border-radius:12px;box-shadow:0 6px 22px #0002;padding:9px}
.action{border-radius:8px;font-size:12px;font-weight:600}
.action.gold{background:var(--gold);color:#fff}
.fab{width:52px;height:52px;border-radius:14px;box-shadow:0 3px 12px #0002;font-size:27px}
.modal-backdrop{background:#0007}
.modal{border-radius:14px;padding:19px;box-shadow:0 12px 40px #0003;transform:translateY(10px)}
.modal h2{font:600 21px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif}
.formrow label{font-size:12px;font-weight:600;letter-spacing:0}
.formrow textarea{border-radius:9px}
.drawer{padding:20px}
.drawer .brand{font-size:19px;margin:4px 0 22px}
.navitem{border-radius:8px;font-size:14px;font-weight:550}
.navitem.active{background:var(--gold-soft);color:var(--ink)}
.footer-note{display:none}
@media(max-width:620px){
 .topbar{height:56px;padding:0 9px;gap:6px}
 .brand{font-size:17px}
 .top-title,.top-divider{display:none}
 .saved{font-size:0;min-width:28px;padding:6px 7px;text-align:center;background:transparent}
 .saved:before{content:"✓";font-size:13px}
 .icon{width:32px;height:34px;flex:0 0 32px}
 .layout{padding:17px 13px 90px}
 .class-meta{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
 .fieldbox label{font-size:11px}
 .fieldbox select,.date-input{min-height:42px;padding:9px 8px;font-size:13px}
 .summary{gap:5px;margin-bottom:17px}
 .stat{font-size:11px;padding:8px 2px}
 .list-head{margin-bottom:7px}
 .student{padding:11px 5px;min-height:64px}
 .student-name{font-size:13px}
 .status{min-width:88px;padding:7px 7px;font-size:11px}.quick-attendance{gap:5px}.quick-mark{width:36px;height:38px}
 .arrow{display:none}
 .hint{font-size:10px}
 .bulkbar{bottom:10px}
 .fab{bottom:15px;right:15px;width:49px;height:49px}
}

.quick-attendance{display:flex;align-items:center;gap:6px;flex:0 0 auto}.quick-mark{width:39px;height:39px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--muted);font-size:14px;font-weight:750;transition:background .16s,color .16s,border-color .16s,transform .12s}.quick-mark:active{transform:scale(.94)}.quick-mark.is-present{background:var(--green-bg);color:var(--green);border-color:color-mix(in srgb,var(--green) 42%,var(--line))}.quick-mark.is-absent{background:var(--red-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 42%,var(--line))}.quick-mark:focus-visible{outline:2px solid var(--focus);outline-offset:2px}


/* Teacher Student Directory — additions to the locked Celestial shell */
.dir-page{padding:8px 0 54px}
.dir-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 20px}
.dir-eyebrow{font-size:10px;letter-spacing:.13em;font-weight:750;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.dir-title{font:30px/1.12 Georgia,serif;letter-spacing:-.02em;margin:0}
.dir-description{font-size:13px;color:var(--muted);margin:7px 0 0;max-width:520px}
.dir-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 21px}
.dir-metric{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;min-width:0}
.dir-metric strong{display:block;font-size:21px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.dir-metric span{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.dir-controls{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:13px}
.dir-search{position:relative}
.dir-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-52%);font-size:23px;color:var(--muted);pointer-events:none;line-height:1}
.dir-search input{width:100%;height:45px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);padding:0 13px 0 42px;outline:none;font-size:13px}
.dir-search input:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.dir-filter-block{margin-top:13px}
.dir-filter-label{display:block;font-size:10px;letter-spacing:.08em;font-weight:750;color:var(--muted);text-transform:uppercase;margin:0 0 8px 1px}
.dir-chip-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dir-chip{border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);padding:7px 11px;font-size:11px;font-weight:650;white-space:nowrap}
.dir-chip[aria-pressed=true]{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,var(--line));color:var(--ink)}
.dir-filter-divider{height:1px;background:var(--line);margin:13px 0}
.dir-roster-note{font-size:11px;color:var(--muted);margin:12px 2px 17px;display:flex;align-items:flex-start;gap:7px}
.dir-roster-note strong{font-weight:650;color:var(--ink)}
.dir-list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 9px}
.dir-list-head strong{font-size:13px;font-weight:700}
.dir-list-head span{font-size:11px;color:var(--muted)}
.dir-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.dir-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:76px;transition:background .15s}
.dir-row:last-child{border-bottom:0}
.dir-row:hover{background:var(--surface2)}
.dir-row:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
.dir-avatar{width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:800}
.dir-person{flex:1;min-width:0}
.dir-person-name{font-size:13px;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir-subjects{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dir-subject-tag{font-size:10px;line-height:1.35;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.dir-row-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.dir-status{font-size:10px;font-weight:700;border-radius:99px;padding:5px 8px;white-space:nowrap}
.dir-status.active{color:var(--green);background:var(--green-bg)}
.dir-status.inactive{color:var(--amber);background:var(--amber-bg)}
.dir-chevron{font-size:20px;color:var(--muted);line-height:1}
.dir-empty{padding:35px 18px;text-align:center;color:var(--muted);font-size:12px}
.dir-empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.dir-clear{margin-top:12px;border:0;background:transparent;color:var(--gold);font-size:12px;font-weight:700;padding:5px}
.dir-footnote{font-size:10px;color:var(--muted);margin:13px 2px 0}
.dir-modal-subjects{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}
.dir-detail-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.dir-detail-row:last-child{border-bottom:0}
.dir-detail-row span:first-child{color:var(--muted)}
.dir-subject-option{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
.dir-subject-option:last-child{border-bottom:0}
.dir-subject-option input{accent-color:var(--gold);width:16px;height:16px}
.dir-form-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface2);color:var(--ink);outline:none;font-size:13px}
.dir-form-input:focus{border-color:var(--focus)}
.dir-help{font-size:10px;color:var(--muted);margin-top:6px}
.dir-add-button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:11px;font-weight:700}
.dir-add-button:hover{background:var(--surface2)}
.navitem.active{background:var(--gold-soft);color:var(--ink)}
@media(max-width:600px){
 .dir-page{padding-top:3px}
 .dir-heading{align-items:flex-start;margin-bottom:16px}
 .dir-title{font-size:27px}
 .dir-description{font-size:12px}
 .dir-metrics{gap:7px;margin-bottom:15px}
 .dir-metric{padding:11px 10px;border-radius:11px}
 .dir-metric strong{font-size:19px}
 .dir-metric span{font-size:10px}
 .dir-controls{padding:11px;border-radius:13px}
 .dir-row{padding:12px 10px;gap:9px;min-height:70px}
 .dir-avatar{width:35px;height:35px;flex-basis:35px}
 .dir-row-side{gap:6px}
 .dir-status{font-size:9px;padding:5px 7px}
}


/* T06 Student Profile */
.profile-page{max-width:880px;margin:0 auto;padding:8px 0 60px}
.profile-back{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:650;padding:5px 0;margin:0 0 15px}
.profile-hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}
.profile-photo{width:62px;height:62px;flex:0 0 62px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:750;font-size:19px;overflow:hidden}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-hero-main{min-width:0;flex:1}
.profile-name{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.profile-meta{font-size:12px;color:var(--muted);margin-top:5px}
.profile-hero-actions{display:flex;align-items:center;gap:7px}
.profile-section{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.profile-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line)}
.profile-section-head h2{font-size:14px;font-weight:700;margin:0}
.profile-section-body{padding:4px 15px 13px}
.profile-edit{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:650}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.profile-field{padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.profile-field label{display:block;color:var(--muted);font-size:10px;font-weight:650;margin-bottom:4px}
.profile-field div{font-size:13px;overflow-wrap:anywhere}
.profile-muted{color:var(--muted)}
.guardian-card{border:1px solid var(--line);border-radius:11px;padding:12px;margin:11px 0;background:var(--surface2)}
.guardian-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.guardian-name{font-size:13px;font-weight:700}
.guardian-relation{font-size:11px;color:var(--muted);margin-top:3px}
.guardian-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.contact-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:11px;text-decoration:none;color:var(--ink);font-weight:650}
.contact-link:hover{border-color:var(--gold)}
.profile-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.profile-tag{font-size:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--muted)}
.enrolment-row,.attendance-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.enrolment-row:last-child,.attendance-row:last-child{border-bottom:0}
.enrolment-name{font-weight:650}
.enrolment-meta{font-size:10px;color:var(--muted);margin-top:3px}
.profile-pill{font-size:10px;border-radius:99px;padding:5px 8px;background:var(--green-bg);color:var(--green);font-weight:700;white-space:nowrap}
.profile-pill.inactive{background:var(--amber-bg);color:var(--amber)}
.attendance-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.attendance-stat{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center}
.attendance-stat strong{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.attendance-stat span{font-size:10px;color:var(--muted)}
.profile-note{font-size:11px;color:var(--muted);line-height:1.5;margin:9px 0}
.profile-modal-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-modal-form .wide{grid-column:1/-1}
.profile-modal-form label{display:block;font-size:11px;color:var(--muted);font-weight:650;margin:0 0 5px}
.profile-modal-form input,.profile-modal-form select,.profile-modal-form textarea{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:10px;font:inherit;font-size:13px;min-height:40px}
.profile-modal-form textarea{min-height:68px}
.profile-check{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:9px}
.profile-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px;flex-wrap:wrap}
.profile-modal-actions button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 12px;font-size:12px;font-weight:650}
.profile-modal-actions .primary{background:var(--gold);border-color:var(--gold);color:#fff}
.profile-danger{color:var(--red)!important}
@media(max-width:620px){
 .profile-hero{padding:12px;gap:10px}.profile-photo{width:50px;height:50px;flex-basis:50px}
 .profile-name{font-size:18px}.profile-hero-actions{gap:4px}
 .profile-grid{grid-template-columns:1fr}
 .profile-modal-form{grid-template-columns:1fr}.profile-modal-form .wide{grid-column:auto}
 .attendance-summary{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
 .attendance-stat{padding:8px 3px}.attendance-stat strong{font-size:16px}.attendance-stat span{font-size:9px}
}
</style></head><body>

<div class="app" id="app">
  <header class="topbar">
    <button class="icon" aria-label="Open menu" onclick="toggleMenu()">☰</button>
    <div class="brand">Celestial</div>
    <div class="top-divider"></div>
    <div class="top-title" id="topTitle">Student Profile</div>
    <div class="spacer"></div>
    <span class="saved" id="saveState">✓ Saved</span>
    <button class="icon theme-toggle" id="themeBtn" title="Switch theme" aria-label="Switch theme" onclick="cycleTheme()">☾</button>
  </header>
  <main class="layout"><div id="screen" class="page"></div></main>
  <div class="bulkbar" id="bulkbar" style="display:none"></div>
  
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div>
  <div class="menu" id="menu" onclick="if(event.target===this)toggleMenu(false)">
    <aside class="drawer">
      <div class="brand">Celestial</div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:750;margin:24px 12px 8px">TEACHER WORKSPACE</div>
      <button class="navitem" onclick="openReference('prototype/class-register.html')">▤ &nbsp; Class Register</button>
      <button class="navitem active" onclick="toggleMenu(false)">♙ &nbsp; My Students</button>
      <button class="navitem" onclick="openReference('prototype/history-v1.2.html')">◷ &nbsp; History</button>
      <button class="navitem" onclick="showPreferences()">⚙ &nbsp; Account & Preferences</button>
      <div style="font-size:10px;color:var(--muted);line-height:1.55;margin:24px 12px 0">Student records shown here are illustrative prototype data. Access to real records must be restricted by the signed-in teacher's permissions.</div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
const PROFILE_KEY='celestial-student-profile-v1-demo';
const seed={
 theme:'light',
 students:[
  {id:'s1',name:'Ananya Das',dob:'2014-08-16',address:'Lalpur, Ranchi',studentPhone:'',school:'St. Xavier’s School',schoolClass:'Class VI',photo:'',status:'Active',guardianLinks:[{guardianId:'g1',relationship:'Father',primary:true},{guardianId:'g2',relationship:'Mother',primary:false}],enrolments:[{subject:'Piano',teacher:'Stephen',status:'Active',since:'12 Jan 2024',scope:'mine'},{subject:'Vocals',teacher:'Mrs. Meera',status:'Active',since:'03 Jun 2025',scope:'other'}],attendance:{present:34,absent:3,leave:2,unmarked:1,recent:[{date:'25 Nov 2026',subject:'Piano',status:'Present'},{date:'22 Nov 2026',subject:'Vocals',status:'Present'},{date:'18 Nov 2026',subject:'Piano',status:'Absent'}]}},
  {id:'s2',name:'Arjun Das',dob:'2011-02-04',address:'Lalpur, Ranchi',studentPhone:'',school:'St. Xavier’s School',schoolClass:'Class IX',photo:'',status:'Active',guardianLinks:[{guardianId:'g1',relationship:'Father',primary:true}],enrolments:[{subject:'Guitar',teacher:'Stephen',status:'Active',since:'10 Mar 2025',scope:'mine'}],attendance:{present:28,absent:1,leave:1,unmarked:0,recent:[]}}
 ],
 guardians:[
  {id:'g1',name:'Sanjay Das',relationship:'Father',phone:'+91 98765 43210',whatsapp:'+91 98765 43210',email:'sanjay.das@example.com',primary:true},
  {id:'g2',name:'Madhuri Das',relationship:'Mother',phone:'+91 98765 43211',whatsapp:'',email:'',primary:false}
 ]
};
let state=loadState(),studentId='s1',toastTimer=null,themePref=state.theme||'light';
function clone(v){return JSON.parse(JSON.stringify(v))}
function loadState(){try{const x=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');if(x&&x.students&&x.guardians)return x}catch(e){}return clone(seed)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function student(){return state.students.find(s=>s.id===studentId)||state.students[0]}
function guardian(id){return state.guardians.find(g=>g.id===id)}\nfunction studentGuardians(s){return (s.guardianLinks||[]).map(link=>{const g=guardian(link.guardianId);return g?{...g,relationship:link.relationship,primary:link.primary}:null}).filter(Boolean)}
function age(dob){if(!dob)return '—';const d=new Date(dob+'T12:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a+' years'}
function recordAudit(action){state.audit=state.audit||[];state.audit.unshift({action,actor:'Stephen (demo teacher)',at:new Date().toISOString()});state.audit=state.audit.slice(0,20)}\nfunction persist(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(state));document.getElementById('saveState').textContent='✓ Saved';}catch(e){document.getElementById('saveState').textContent='Demo only'}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function applyTheme(){const resolved=themePref==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):themePref;document.documentElement.dataset.theme=resolved;document.getElementById('themeBtn').textContent=themePref==='dark'?'☀':themePref==='light'?'☾':'◐';document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}
function cycleTheme(){themePref=themePref==='light'?'dark':themePref==='dark'?'system':'light';state.theme=themePref;persist();applyTheme();toast('Theme: '+themePref)}
function toggleMenu(force){const m=document.getElementById('menu');if(force===false)m.classList.remove('open');else m.classList.toggle('open')}
function openReference(path){toggleMenu(false);const root='https://steph1420.github.io/Celestial-Music-Classes/';const target=path.includes('teacher-student-directory')?root:path.includes('history')?root+'prototype/history-v1.2.html':root+'prototype/class-register.html';window.location.href=target}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function showModal(title,body,actions){document.getElementById('modal').innerHTML='<div class="modal-head"><div><h2>'+esc(title)+'</h2></div><button class="icon close" onclick="closeModal()" aria-label="Close">×</button></div>'+body+'<div class="profile-modal-actions">'+actions+'</div>';document.getElementById('modalBackdrop').classList.add('open')}
function field(label,value){return '<div class="profile-field"><label>'+label+'</label><div>'+(value?esc(value):'<span class="profile-muted">Not provided</span>')+'</div></div>'}
function contactLinks(g){let out='';if(g.phone)out+='<a class="contact-link" href="tel:'+encodeURIComponent(g.phone)+'">☎ Call</a>';const wa=g.whatsapp||g.phone;if(wa)out+='<a class="contact-link" href="https://wa.me/'+wa.replace(/[^0-9]/g,'')+'" target="_blank" rel="noopener">◉ WhatsApp</a>';if(g.phone)out+='<a class="contact-link" href="sms:'+encodeURIComponent(g.phone)+'">✉ SMS</a>';if(g.email)out+='<a class="contact-link" href="mailto:'+encodeURIComponent(g.email)+'">✉ Email</a>';return out}
function initials(name){return String(name||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}\nfunction render(){const s=student();if(!s)return;applyTheme();document.getElementById('topTitle').textContent='Student Profile';const photo=s.photo?'<img src="'+esc(s.photo)+'" alt="">':esc(initials(s.name));const mine=s.enrolments.filter(e=>e.scope==='mine'),other=s.enrolments.filter(e=>e.scope!=='mine');const guardians=studentGuardians(s);const attendance=s.attendance||{present:0,absent:0,leave:0,unmarked:0,recent:[]};
document.getElementById('screen').innerHTML='<div class="profile-page"><button class="profile-back" onclick="openReference(\'prototype/teacher-student-directory-v1.html\')">← &nbsp; Back to My Students</button>'+
'<section class="profile-hero"><div class="profile-photo">'+photo+'</div><div class="profile-hero-main"><div class="profile-name">'+esc(s.name)+'</div><div class="profile-meta">'+esc(s.schoolClass||'Class not provided')+' · '+esc(age(s.dob))+' · '+esc(s.status)+'</div><div class="profile-tags"><span class="profile-tag">'+esc(s.id.toUpperCase())+'</span></div></div><div class="profile-hero-actions"><button class="profile-edit" onclick="editStudent()">Edit</button></div></section>'+
'<section class="profile-section"><div class="profile-section-head"><h2>Personal details</h2><button class="profile-edit" onclick="editStudent()">Edit</button></div><div class="profile-section-body"><div class="profile-grid">'+field('Date of birth',s.dob?new Date(s.dob+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'')+field('Age',age(s.dob))+field('Home address',s.address)+field('Student phone',s.studentPhone)+field('School',s.school)+field('Class / grade',s.schoolClass)+'</div><p class="profile-note">Age is calculated from date of birth. Student details shown here are illustrative.</p></div></section>'+
'<section class="profile-section"><div class="profile-section-head"><h2>Parent / Guardian</h2><button class="profile-edit" onclick="addGuardian()">＋ Add</button></div><div class="profile-section-body">'+(guardians.length?guardians.map(g=>'<article class="guardian-card"><div class="guardian-top"><div><div class="guardian-name">'+esc(g.name)+' '+(g.primary?'<span class="profile-pill">Primary</span>':'')+'</div><div class="guardian-relation">'+esc(g.relationship)+'</div></div><button class="profile-edit" onclick="editGuardian(\''+g.id+'\')">Edit</button></div><div class="profile-grid">'+field('Phone',g.phone)+field('WhatsApp',g.whatsapp)+field('Email',g.email)+'</div><div class="guardian-actions">'+contactLinks(g)+'</div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="profile-edit profile-danger" onclick="unlinkGuardian(\''+g.id+'\')">Remove from this student</button></div></article>').join(''):'<div class="profile-note">No guardian linked yet.</div>')+'<p class="profile-note">Guardian contact details are shared records. Editing a shared guardian updates it for every linked student. Removing a guardian here only unlinks them from this student.</p></div></section>'+
'<section class="profile-section"><div class="profile-section-head"><h2>Enrolments</h2></div><div class="profile-section-body">'+(mine.length?'<div class="profile-note">Your enrolments</div>'+mine.map(enrolmentHTML).join(''):'<p class="profile-note">No enrolments assigned to you.</p>')+(other.length?'<div class="profile-note" style="margin-top:14px">Other subjects · read-only summary</div>'+other.map(enrolmentHTML).join(''):'')+'</div></section>'+
'<section class="profile-section"><div class="profile-section-head"><h2>Attendance</h2><button class="profile-edit" onclick="openHistory()">Open History ↗</button></div><div class="profile-section-body"><div class="attendance-summary"><div class="attendance-stat"><strong>'+attendance.present+'</strong><span>Present</span></div><div class="attendance-stat"><strong>'+attendance.absent+'</strong><span>Absent</span></div><div class="attendance-stat"><strong>'+attendance.leave+'</strong><span>Leave</span></div><div class="attendance-stat"><strong>'+attendance.unmarked+'</strong><span>Unmarked</span></div></div>'+(attendance.recent||[]).map(a=>'<div class="attendance-row"><div><strong>'+esc(a.subject)+'</strong><div class="enrolment-meta">'+esc(a.date)+'</div></div><span class="profile-pill '+(a.status==='Present'?'':'inactive')+'">'+esc(a.status)+'</span></div>').join('')+'<p class="profile-note">Attendance summary is illustrative. Full lesson history is available in History.</p></div></section>'+
+'<section class="profile-section"><div class="profile-section-head"><h2>Recent changes</h2><span class="profile-note">Audit trail</span></div><div class="profile-section-body">'+((state.audit||[]).length?state.audit.map(a=>'<div class="attendance-row"><div><strong>'+esc(a.action)+'</strong><div class="enrolment-meta">'+esc(a.actor)+' · '+new Date(a.at).toLocaleString('en-IN')+'</div></div></div>').join(''):'<p class="profile-note">No changes recorded in this demo yet.</p>')+'</div></section>'+'<p class="profile-note">Demo prototype · Illustrative records · Browser-local changes only · No finance information is shown.</p></div>'}
function enrolmentHTML(e){return '<div class="enrolment-row"><div><div class="enrolment-name">'+esc(e.subject)+'</div><div class="enrolment-meta">'+esc(e.teacher)+' · Since '+esc(e.since)+'</div></div><span class="profile-pill '+(e.status==='Active'?'':'inactive')+'">'+esc(e.status)+'</span></div>'}
function openHistory(){openReference('prototype/history-v1.2.html')}
function editStudent(){const s=student();const body='<div class="profile-modal-form"><div class="wide"><label>STUDENT NAME · VIEW ONLY</label><input value="'+esc(s.name)+'" disabled></div><div class="wide"><label>PROFILE PHOTO URL · OPTIONAL</label><input id="pPhoto" type="url" value="'+esc(s.photo)+'" placeholder="https://…"></div><div><label>DATE OF BIRTH</label><input id="pDob" type="date" value="'+esc(s.dob)+'"></div><div><label>AGE · CALCULATED</label><input value="'+esc(age(s.dob))+'" disabled></div><div class="wide"><label>HOME ADDRESS</label><textarea id="pAddress">'+esc(s.address)+'</textarea></div><div><label>STUDENT PHONE</label><input id="pPhone" type="tel" value="'+esc(s.studentPhone)+'"></div><div><label>SCHOOL</label><input id="pSchool" value="'+esc(s.school)+'"></div><div><label>CLASS / GRADE</label><input id="pClass" value="'+esc(s.schoolClass)+'"></div></div><p class="profile-note">Teachers can edit contact and education details. Name, status and enrolments are managed separately.</p>';showModal('Edit student details',body,'<button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveStudent()">Save changes</button>')}
function saveStudent(){const s=student();recordAudit('Updated student contact / education details');s.photo=document.getElementById('pPhoto').value.trim();s.dob=document.getElementById('pDob').value;s.address=document.getElementById('pAddress').value.trim();s.studentPhone=document.getElementById('pPhone').value.trim();s.school=document.getElementById('pSchool').value.trim();s.schoolClass=document.getElementById('pClass').value.trim();persist();closeModal();render();toast('Student details saved')}
function guardianForm(g){const x=g||{name:'',relationship:'',phone:'',whatsapp:'',email:'',primary:!(student().guardianLinks||[]).some(link=>link.primary)};return '<div class="profile-modal-form"><div class="wide"><label>FULL NAME</label><input id="gName" value="'+esc(x.name)+'" required></div><div><label>RELATIONSHIP</label><select id="gRelation">'+['Father','Mother','Guardian','Grandparent','Other'].map(v=>'<option '+(x.relationship===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label>PHONE</label><input id="gPhone" type="tel" value="'+esc(x.phone)+'"></div><div><label>WHATSAPP NUMBER</label><input id="gWhatsApp" type="tel" value="'+esc(x.whatsapp)+'" placeholder="Leave blank if same as phone"></div><div class="wide"><label>EMAIL · OPTIONAL</label><input id="gEmail" type="email" value="'+esc(x.email)+'"></div><label class="profile-check wide"><input id="gPrimary" type="checkbox" '+(x.primary?'checked':'')+'> Primary contact for this student</label></div>'}
function saveGuardian(id){const name=document.getElementById('gName').value.trim();if(!name){toast('Enter the guardian name');return}const existing=id?guardian(id):null;const values={name,phone:document.getElementById('gPhone').value.trim(),whatsapp:document.getElementById('gWhatsApp').value.trim(),email:document.getElementById('gEmail').value.trim()};const relation=document.getElementById('gRelation').value;const primary=document.getElementById('gPrimary').checked;let guardianId=id;if(existing)Object.assign(existing,values);else{guardianId='g'+Date.now();state.guardians.push({id:guardianId,...values});student().guardianLinks.push({guardianId,relationship:relation,primary:false})}const links=student().guardianLinks;const link=links.find(x=>x.guardianId===guardianId);if(link)link.relationship=relation;if(primary){links.forEach(x=>x.primary=false);if(link)link.primary=true}else if(link)link.primary=false;recordAudit(existing?'Updated shared guardian contact details':'Added guardian link');persist();closeModal();render();toast(existing?'Guardian updated':'Guardian added');}
function editGuardian(id){const g=guardian(id);if(!g)return;showModal('Edit guardian',guardianForm(g),'<button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveGuardian(\''+id+'\')">Save changes</button>')}
function addGuardian(){showModal('Add guardian',guardianForm(null),'<button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveGuardian(null)">Add guardian</button>')}
function unlinkGuardian(id){const g=guardian(id);if(!g)return;const linked=state.students.filter(s=>(s.guardianLinks||[]).some(x=>x.guardianId===id)).length;showModal('Remove guardian?', '<p class="profile-note">This removes '+esc(g.name)+' from '+esc(student().name)+' only. The shared guardian record remains linked to '+(linked-1)+' other student(s), if applicable.</p>','<button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmUnlink(\''+id+'\')">Remove link</button>')}
function confirmUnlink(id){const s=student();s.guardianLinks=s.guardianLinks.filter(x=>x.guardianId!==id);const linked=state.students.some(x=>(x.guardianLinks||[]).some(link=>link.guardianId===id));if(!linked)state.guardians=state.guardians.filter(g=>g.id!==id);recordAudit('Removed guardian link');persist();closeModal();render();toast('Guardian link removed')}
function openHistory(){openReference('prototype/history-v1.2.html')}
function showPreferences(){toggleMenu(false);const body='<p class="profile-note">Choose how Celestial appears on this device.</p>'+['light','dark','system'].map(v=>'<label class="profile-check"><input type="radio" name="themeChoice" value="'+v+'" '+(themePref===v?'checked':'')+' onchange="themePref=this.value;state.theme=this.value;persist();applyTheme()">'+v.charAt(0).toUpperCase()+v.slice(1)+'</label>').join('');showModal('Appearance',body,'<button class="primary" onclick="closeModal()">Done</button>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script></body></html>
