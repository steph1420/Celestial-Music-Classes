const KEY='celestial-register-v2';const initial={theme:'light',teacher:'Stephen Lakra',subject:'Piano',date:'2026-11-27',students:[{id:1,name:'Aarav Sharma',subject:'Piano',status:'Present',topic:'C major scale and broken chords',homework:'Practise hands separately, 10 minutes daily.',remarks:'Good progress with finger positioning.'},{id:2,name:'Ananya Das',subject:'Piano',status:'Present',topic:'',homework:'',remarks:''},{id:3,name:'Misha Singh',subject:'Piano',status:'Unmarked',topic:'',homework:'',remarks:''},{id:4,name:'Rohan Kumar',subject:'Piano',status:'Unmarked',topic:'',homework:'',remarks:''},{id:5,name:'Ishita Roy',subject:'Vocals',status:'Unmarked',topic:'',homework:'',remarks:''}],audit:[]};let state=load(),registerUndo=[],registerRedo=[],generalUndo=[],generalRedo=[],navStack=['register'],selected=new Set(),selectMode=false,longTimer=null,longTriggered=false,clipboard=null,currentStudent=null,toastTimer=null,themePref=state.theme||'light';function load(){try{return {...structuredClone(initial),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(initial)}}function persist(){document.getElementById('saveState').textContent='Saving…';localStorage.setItem(KEY,JSON.stringify(state));setTimeout(()=>document.getElementById('saveState').textContent='✓ Saved',180)}function snapshot(){return JSON.stringify(state.students)}function commit(label,before){registerUndo.push({label,before,after:snapshot()});if(registerUndo.length>100)registerUndo.shift();registerRedo=[];state.audit.push({label,when:new Date().toLocaleString()});if(state.audit.length>150)state.audit.shift();persist();updateHistoryButtons()}function updateHistoryButtons(){undoBtn.disabled=!registerUndo.length;redoBtn.disabled=!registerRedo.length}function undo(){if(!registerUndo.length)return;let x=registerUndo.pop();registerRedo.push({label:x.label,before:x.before,after:snapshot()});state.students=JSON.parse(x.before);persist();render();toast('Undid: '+x.label);updateHistoryButtons()}function redo(){if(!registerRedo.length)return;let x=registerRedo.pop();registerUndo.push({label:x.label,before:snapshot(),after:x.after});state.students=JSON.parse(x.after);persist();render();toast('Redid: '+x.label);updateHistoryButtons()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1900)}function applyTheme(){document.documentElement.dataset.theme=themePref==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):themePref;themeBtn.textContent=themePref==='dark'?'☀':themePref==='light'?'☾':'◐';document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}function cycleTheme(){themePref=themePref==='light'?'dark':themePref==='dark'?'system':'light';state.theme=themePref;persist();applyTheme();toast('Theme: '+themePref[0].toUpperCase()+themePref.slice(1))}function count(s){return state.students.filter(x=>x.subject===state.subject&&x.status===s).length}function visible(){return state.students.filter(x=>x.subject===state.subject)}function render(){setActiveNav('register');applyTheme();let rows=visible();let html=`<section class="class-meta"><div class="fieldbox"><label>Subject</label><select aria-label="Subject" onchange="state.subject=this.value;selected.clear();selectMode=false;persist();render()"><option ${state.subject==='Piano'?'selected':''}>Piano</option><option ${state.subject==='Vocals'?'selected':''}>Vocals</option><option ${state.subject==='Guitar'?'selected':''}>Guitar</option></select></div><div class="fieldbox"><label>Class date</label><input class="date-input" aria-label="Class date" type="date" value="${state.date}" onchange="state.date=this.value;persist();render()"></div></section><section class="summary"><div class="stat present">${count('Present')} Present</div><div class="stat absent">${count('Absent')} Absent</div><div class="stat leave">${count('Leave')} Leave</div><div class="stat unmarked">${count('Unmarked')} Unmarked</div></section><div class="list-head"><strong>${rows.length} students</strong><span class="hint">${selectMode?'Tap students to select':'Press and hold to select multiple'}</span></div><div class="student-list ${selectMode?'selecting':''}" id="studentList">${rows.map(s=>`<article class="student ${selected.has(s.id)?'selected':''}" data-id="${s.id}" onpointerdown="pointerDown(event,${s.id})" onpointerup="pointerUp()" onpointerleave="pointerCancel()" onpointercancel="pointerCancel()" onclick="rowClick(event,${s.id})"><div class="check">${selected.has(s.id)?'✓':''}</div><div class="student-info"><div class="student-name">${esc(s.name)}</div><div class="student-sub">${s.topic?esc(s.topic):'Lesson details not added'}</div></div><div class="quick-attendance" role="group" aria-label="Quick attendance for ${esc(s.name)}"><button class="quick-mark ${s.status==='Present'?'is-present':''}" aria-label="Mark ${esc(s.name)} present" aria-pressed="${s.status==='Present'}" onclick="event.stopPropagation();changeStatus(${s.id},'Present')">P</button><button class="quick-mark ${s.status==='Absent'?'is-absent':''}" aria-label="Mark ${esc(s.name)} absent" aria-pressed="${s.status==='Absent'}" onclick="event.stopPropagation();changeStatus(${s.id},'Absent')">A</button></div><span class="arrow">›</span></article>`).join('')||'<div class="empty">No students for this subject.</div>'}</div>`;document.getElementById('screen').innerHTML=html;topTitle.textContent=({register:'Class Register',students:'My Students',history:'History',preferences:'Account & Preferences'})[navStack.at(-1)]||'Class Register';fab.style.display=navStack.at(-1)==='register'?'block':'none';updateHistoryButtons();renderBulk()}let page='register';function setActiveNav(key){document.querySelectorAll('.drawer .navitem[data-nav]').forEach(button=>{const active=button.dataset.nav===key;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')})}function go(p){if(p==='students'){window.location.href='https://steph1420.github.io/Celestial-Music-Classes/?v=navfix-20261127';return}if(page!==p){navStack.push(p);page=p}toggleMenu(false);selected.clear();selectMode=false;renderPage()}let historyMode='date',historyQuery='',historyDate='',selectedHistoryStudent='',studentHistoryFilter='present';
const historyRecords=[
{id:'h1',name:'Aarav Sharma',subject:'Piano',date:'2026-11-27',time:'4:00 PM',status:'Present',topic:'C major scale and broken chords',homework:'Practise hands separately, 10 minutes daily.',remarks:'Good progress with finger positioning.'},
{id:'h2',name:'Ananya Das',subject:'Piano',date:'2026-11-27',time:'4:30 PM',status:'Present',topic:'Reading notes in the treble clef',homework:'Complete the note-reading exercise.',remarks:''},
{id:'h3',name:'Misha Singh',subject:'Piano',date:'2026-11-26',time:'4:00 PM',status:'Absent',topic:'',homework:'',remarks:'Absent from class.'},

function niceDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function historyStatusClass(s){return s==='Present'?'present':s==='Absent'?'absent':s==='Leave'?'leave':s==='Provisional'?'provisional':'unmarked'}
function historyStudents(){return [...new Set(historyRecords.map(r=>r.name))].sort((a,b)=>a.localeCompare(b))}
function historyContent(){
 const tabs=`<div class="segmented history-tabs"><button class="${historyMode==='date'?'active':''}" onclick="historyMode='date';renderPage()">By date</button><button class="${historyMode==='student'?'active':''}" onclick="historyMode='student';renderPage()">By student</button></div>`;
 let controls='';
 if(historyMode==='date'){
   controls=`<div class="history-tools"><div class="history-search"><span>⌕</span><input id="historySearchInput" value="${esc(historyQuery)}" placeholder="Search student" aria-label="Search student" oninput="historyQuery=this.value;refreshHistoryResults()"></div><input class="history-date" type="date" aria-label="Filter by date" value="${historyDate}" onchange="historyDate=this.value;refreshHistoryResults()"><button class="action" onclick="historyQuery='';historyDate='';renderPage()">Clear</button></div>`;
 }else{
   controls=`<div class="history-student-picker"><label for="historyStudentSelect">SELECT STUDENT</label><select id="historyStudentSelect" class="history-student-select" onchange="selectedHistoryStudent=this.value;refreshHistoryResults()"><option value="">Choose a student</option>${historyStudents().map(n=>`<option value="${esc(n)}" ${selectedHistoryStudent===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="segmented history-tabs history-filter-tabs" aria-label="Filter attendance records"><button class="${studentHistoryFilter==='present'?'active':''}" onclick="studentHistoryFilter='present';refreshHistoryResults()">Present</button><button class="${studentHistoryFilter==='all'?'active':''}" onclick="studentHistoryFilter='all';refreshHistoryResults()">All records</button></div>`;
 }
 return `<div class="history-head"><div><h1>History</h1><p class="hint">Your previous lessons and attendance.</p></div></div>${tabs}${controls}<div id="historyResults">${historyResultsHTML()}</div><p class="footer-note">Lesson history is read-only. Open a record to review its details.</p>`;
}
function historyResultsHTML(){
 const statusClass=historyStatusClass;
 let records=[];
 if(historyMode==='date'){
   records=historyRecords.filter(r=>(!historyQuery||r.name.toLowerCase().includes(historyQuery.trim().toLowerCase()))&&(!historyDate||r.date===historyDate));
 }else{
   if(!selectedHistoryStudent)return `<div class="empty history-empty"><div class="history-empty-icon">⌕</div><b>Select a student</b><span>Choose a student above to see their attendance dates.</span></div>`;
   records=historyRecords.filter(r=>r.name===selectedHistoryStudent&&(studentHistoryFilter==='all'||r.status==='Present'));
 }
 if(!records.length){
   const message=historyMode==='student'?(studentHistoryFilter==='present'?'No dates marked Present for this student.':'No records found for this student.'):'No lesson records match these filters.';
   return `<div class="empty">${message}</div>`;
 }
 const groups={};records.forEach(r=>(groups[r.date]??=[]).push(r));
 const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
 let summary='';
 if(historyMode==='student'){
   const allStudentRecords=historyRecords.filter(r=>r.name===selectedHistoryStudent);
   const presentDates=new Set(allStudentRecords.filter(r=>r.status==='Present').map(r=>r.date)).size;
   const subjects=[...new Set(allStudentRecords.map(r=>r.subject))];
   summary=`<div class="history-student-summary"><div class="history-student-name">${esc(selectedHistoryStudent)}</div><div class="history-student-meta">${subjects.map(esc).join(' · ')} <span>·</span> ${presentDates} ${presentDates===1?'date':'dates'} present</div></div>`;
 }
 const list=dates.map(d=>`<section class="history-day"><div class="history-day-title">${niceDate(d)}</div>${groups[d].sort((a,b)=>a.time.localeCompare(b.time)).map(r=>historyRow(r,statusClass,historyMode)).join('')}</section>`).join('');
 return summary+list;
}
function historyRow(r,statusClass,mode='date'){
 const title=mode==='student'?esc(r.subject):esc(r.name);

}
function refreshHistoryResults(){const el=document.getElementById('historyResults');if(el)el.innerHTML=historyResultsHTML()}
function openHistoryRecord(id){let r=historyRecords.find(x=>x.id===id);if(!r)return;showModal(r.name,`<div class="sub">${esc(r.subject)} · ${niceDate(r.date)} · ${esc(r.time)}</div><div class="history-detail-status"><span class="history-status ${historyStatusClass(r.status)}">${esc(r.status)}</span></div><div class="formrow"><label>TOPIC COVERED</label><div class="history-detail-text">${r.topic?esc(r.topic):'Not recorded'}</div></div><div class="formrow"><label>HOMEWORK</label><div class="history-detail-text">${r.homework?esc(r.homework):'Not recorded'}</div></div><div class="formrow"><label>REMARKS</label><div class="history-detail-text">${r.remarks?esc(r.remarks):'No remarks'}</div></div><p class="hint">This preview is read-only.</p>`,[['Close','gold',closeModal]])}
function renderPage(){page=navStack.at(-1);setActiveNav(page);if(page==='register'){render();return}applyTheme();topTitle.textContent=page==='students'?'My Students':page==='history'?'History':'Account & Preferences';fab.style.display='none';let content=page==='students'?`<div class="list-head"><strong>My Students</strong><span class="hint">${state.students.length} records</span></div>${state.students.map(s=>`<article class="student"><div class="avatar">${initials(s.name)}</div><div class="student-info"><div class="student-name">${esc(s.name)}</div><div class="student-sub">${esc(s.subject)}</div></div><span class="pill status ${s.status.toLowerCase()}">${s.status}</span></article>`).join('')}`:page==='history'?historyContent():`<h2 style="font:25px Georgia,serif">Account & Preferences</h2><div class="card" style="padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)"><b>${esc(state.teacher)}</b><p class="hint">Teacher account</p><label class="fieldbox"><label>APPEARANCE</label><select onchange="themePref=this.value;state.theme=themePref;persist();applyTheme()"><option value="light" ${themePref==='light'?'selected':''}>Light</option><option value="dark" ${themePref==='dark'?'selected':''}>Dark</option><option value="system" ${themePref==='system'?'selected':''}>System</option></select></label></div>`;document.getElementById('screen').innerHTML=`<div class="page"><div class="list-head"><button class="action" onclick="back()">← Back</button></div>${content}</div>`}function toggleMenu(force){let m=menu;if(force===false)m.classList.remove('open');else m.classList.toggle('open')}function back(){if(modalBackdrop.classList.contains('open')){closeModal();return}if(menu.classList.contains('open')){toggleMenu(false);return}if(navStack.length>1){navStack.pop();page=navStack.at(-1);renderPage();return}if(Date.now()-(window.lastBack||0)<1800){toast('Closing is handled by your browser or device.');window.lastBack=0}else{window.lastBack=Date.now();toast('Press Back again to exit')}}window.addEventListener('keydown',e=>{if(e.key==='Escape'){back()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});window.addEventListener('popstate',()=>back());history.pushState({celestial:true},'','#app');function pointerDown(e,id){if(e.target.closest('button'))return;longTriggered=false;clearTimeout(longTimer);longTimer=setTimeout(()=>{longTriggered=true;selectMode=true;selected.add(id);render();navigator.vibrate?.(18)},480)}function pointerUp(){clearTimeout(longTimer)}function pointerCancel(){clearTimeout(longTimer)}function rowClick(e,id){if(longTriggered){longTriggered=false;return}if(selectMode){selected.has(id)?selected.delete(id):selected.add(id);if(!selected.size)selectMode=false;renderBulk();document.querySelectorAll('.student[data-id]').forEach(el=>{let n=+el.dataset.id;el.classList.toggle('selected',selected.has(n));el.querySelector('.check').textContent=selected.has(n)?'✓':''});return}openStudent(id)}function renderBulk(){bulkbar.classList.toggle('show',selectMode);if(!selectMode){bulkbar.innerHTML='';return}bulkbar.innerHTML=`<span class="bulk-count">${selected.size} selected</span><button class="action" onclick="bulkStatus('Present')">Present</button><button class="action" onclick="bulkStatus('Absent')">Absent</button><button class="action" onclick="bulkStatus('Leave')">Leave</button><button class="action" onclick="commonLesson()">Lesson notes</button><button class="action" onclick="pasteBulk()" ${clipboard?'':'disabled'}>Paste</button><button class="action" onclick="clearSelection()">✕</button>`}function clearSelection(){selected.clear();selectMode=false;render()}function changeStatus(id,status){let before=snapshot(),s=state.students.find(x=>x.id===id);s.status=status;commit('Attendance · '+s.name,before);render();toast(s.name+' marked '+status)}function statusMenu(id){let s=state.students.find(x=>x.id===id);currentStudent=id;showModal(s.name,`<div class="hint">Set attendance</div><div class="status-options">${['Present','Absent','Leave','Unmarked'].map(v=>`<button class="action ${s.status===v?'gold':''}" onclick="setStatusInModal(${id},'${v}')">${v}</button>`).join('')}</div>`,[['Done','gold',closeModal]])}function setStatusInModal(id,v){changeStatus(id,v);closeModal()}function openStudent(id){currentStudent=id;let s=state.students.find(x=>x.id===id);showModal(s.name,`<div class="sub">${s.subject} · ${new Date(state.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div><div class="formrow"><label>ATTENDANCE</label><div class="status-options">${['Present','Absent','Leave','Unmarked'].map(v=>`<button class="action ${s.status===v?'gold':''}" onclick="setModalStatus('${v}')">${v}</button>`).join('')}</div></div><div class="formrow"><label>TOPIC COVERED</label><textarea id="topic" placeholder="What did you cover?">${esc(s.topic)}</textarea></div><div class="formrow"><label>HOMEWORK</label><textarea id="homework" placeholder="What should the student practise?">${esc(s.homework)}</textarea></div><div class="formrow"><label>REMARKS</label><textarea id="remarks" placeholder="Optional observations">${esc(s.remarks)}</textarea></div><div class="modal-actions"><button class="action" onclick="copyDetails(${id})">Copy details</button><button class="action" onclick="pasteDetails()" ${clipboard?'':'disabled'}>Paste details</button></div>`,[['Cancel','',closeModal],['Save details','gold',()=>saveDetails(id)]]);currentStudent=id}function setModalStatus(v){let id=currentStudent,s=state.students.find(x=>x.id===id);let before=snapshot();s.status=v;commit('Attendance · '+s.name,before);openStudent(id)}function saveDetails(id){let before=snapshot(),s=state.students.find(x=>x.id===id);s.topic=topic.value;s.homework=homework.value;s.remarks=remarks.value;commit('Lesson details · '+s.name,before);closeModal();render();toast('Saved automatically')}function copyDetails(id){let s=state.students.find(x=>x.id=== dy}<div class="modal-actions">${actions.map((a,i)=>`<button class="action ${a[1]==='gold'?'gold':''}" onclick="(${a[2].toString()})()">${a[0]}</button>`).join('')}</div>`;modalBackdrop.classList.add('open')}function closeModal(){modalBackdrop.classList.remove('open')}function addStudent(){showModal('Add a student',`<div class="formrow"><label>STUDENT NAME</label><textarea id="newName" style="min-height:42px"></textarea></div><div class="formrow"><label>SUBJECT</label><select id="newSubject" class="fieldbox"><option>Piano</option><option>Vocals</option><option>Guitar</option></select></div>`,[['Cancel','',closeModal],['Add student','gold',()=>{let name=newName.value.trim();if(!name)return toast('Enter a student name');let before=snapshot();state.students.push({id:Math.max(0,...state.students.map(x=>x.id))+1,name,subject:newSubject.value,status:'Unmarked',topic:'',homework:'',remarks:''});commit('Add student · '+name,before);closeModal();render();toast('Student added')}]] )}navStack=['history'];page='history';renderPage();
