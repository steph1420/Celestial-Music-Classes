<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>Celestial · T09 Lesson Detail / Edit</title>
<style>
:root{color-scheme:light;--bg:#f5f3ee;--surface:#fff;--surface2:#f8f7f3;--ink:#172238;--muted:#758091;--line:#e5e4df;--gold:#b99454;--gold-soft:#f3ead9;--green:#247a55;--green-bg:#e5f3eb;--shadow:0 12px 34px #18223810}
[data-theme=dark]{color-scheme:dark;--bg:#0c1119;--surface:#141c27;--surface2:#192331;--ink:#edf0f4;--muted:#9aa5b4;--line:#2a3543;--gold:#d1ad6d;--gold-soft:#332b1e;--green:#6bd1a0;--green-bg:#123629;--shadow:0 16px 44px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0}.brand{font-weight:700;letter-spacing:-.03em}.sep{height:22px;border-left:1px solid var(--line)}.top small{color:var(--muted)}.spacer{flex:1}.icon,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 12px;cursor:pointer;font:inherit}.icon{width:38px;height:38px;padding:0}.wrap{max-width:760px;margin:auto;padding:28px 18px 70px}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}.heading{font-size:25px;letter-spacing:-.04em;margin:5px 0 4px}.intro{color:var(--muted);margin:0 0 24px}.list{background:var(--surface);border-top:1px solid var(--line)}.item{display:flex;align-items:center;gap:14px;padding:16px 12px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover{background:var(--surface2)}.date{width:48px;flex:none;text-align:center;border:1px solid var(--line);border-radius:9px;padding:6px 2px;color:var(--muted);font-size:10px}.date b{display:block;font-size:17px;color:var(--ink)}.info{flex:1;min-width:0}.name{font-weight:650}.sub{color:var(--muted);font-size:12px;margin-top:3px}.topic{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:20px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#080d16a6;display:flex;justify-content:center;align-items:center;padding:16px;opacity:0;pointer-events:none;transition:.18s;z-index:5}.overlay.open{opacity:1;pointer-events:auto}.panel{width:min(540px,100%);max-height:min(90dvh,820px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 25px 80px #0005;transform:translateY(10px);transition:.2s}.open .panel{transform:none}.panel-head{padding:20px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}.panel-head h2{font-size:21px;letter-spacing:-.035em;margin:2px 0}.panel-head .sub{margin:0}.close{margin-left:auto;flex:none}.content{padding:18px 22px 22px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;margin-bottom:20px}.meta label,.field label{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}.meta strong{font-size:13px;font-weight:600}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.sectionhead h3{font-size:14px;margin:0}.field{margin:15px 0}.field textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--surface2);color:var(--ink);font:inherit;outline:none}.field textarea:focus{border-color:var(--gold)}.field textarea:disabled{opacity:1;color:var(--ink);background:transparent;border-color:transparent;padding:2px 0;resize:none;min-height:0}.empty{color:var(--muted);font-size:13px;font-style:italic}.actions{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}.right{display:flex;gap:8px;margin-left:auto}.primary{background:var(--gold);border-color:var(--gold);color:#171b22;font-weight:700}.quiet{color:var(--muted)}.history{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}.history summary{cursor:pointer;font-size:12px;font-weight:650}.event{border-left:2px solid var(--line);padding:1px 0 12px 12px;margin:12px 0 0 3px;font-size:12px}.event b{display:block}.event span{color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:9px;z-index:9;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.tag{font-size:10px;color:var(--green);background:var(--green-bg);padding:4px 7px;border-radius:5px;font-weight:700}@media(max-width:520px){.wrap{padding:20px 13px 50px}.top{padding:0 13px}.top small{display:none}.overlay{padding:0;align-items:flex-end}.panel{width:100%;max-height:94dvh;border-radius:16px 16px 0 0;border-bottom:0}.panel-head{padding:18px 17px 13px}.content{padding:16px 17px 22px}.meta{gap:11px}.heading{font-size:23px}}
</style></head><body>
<header class="top"><div class="brand">Celestial</div><div class="sep"></div><small>Teacher workspace</small><div class="spacer"></div><button class="icon" id="theme" aria-label="Toggle theme">◐</button></header>
<main class="wrap"><div class="eyebrow">T09 · Prototype</div><h1 class="heading">Lesson records</h1><p class="intro">Open a record to review its lesson details. Choose Edit to make a correction.</p><div class="list" id="records"></div></main>
<div class="overlay" id="overlay"><section class="panel" role="dialog" aria-modal="true" aria-labelledby="title"><div class="panel-head"><div><div class="eyebrow">Lesson detail</div><h2 id="title">Lesson record</h2><p class="sub" id="subtitle"></p></div><button class="icon close" id="close" aria-label="Close">×</button></div><div class="content"><div class="meta"><div><label>Student</label><strong id="student"></strong></div><div><label>Subject</label><strong id="subject"></strong></div><div><label>Date</label><strong id="date"></strong></div><div><label>Teacher</label><strong id="teacher"></strong></div></div><div class="sectionhead"><h3>Lesson information</h3><span class="tag" id="mode">Saved record</span></div>
<div class="field"><label for="topic">Topic covered</label><textarea id="topic" rows="2" disabled placeholder="No topic recorded"></textarea></div>
<div class="field"><label for="homework">Homework</label><textarea id="homework" rows="2" disabled placeholder="No homework recorded"></textarea></div>
<div class="field"><label for="remarks">Remarks</label><textarea id="remarks" rows="2" disabled placeholder="No remarks recorded"></textarea></div>
<div class="actions"><button class="btn quiet" id="historyBtn">Change history</button><div class="right"><button class="btn" id="cancel" hidden>Cancel</button><button class="btn primary" id="edit">Edit lesson</button><button class="btn primary" id="save" hidden>Save changes</button></div></div>
<div class="history" id="history" hidden><details open><summary>Lesson changes</summary><div id="events"></div></details></div>
</div></section></div><div class="toast" id="toast"></div>
<script>
const data=[
{id:'LR-1048',student:'Aarav Kumar',subject:'Keyboard',date:'28 Nov 2026',time:'4:00 PM',teacher:'Stephen Lakra',topic:'C major scale — right-hand fingering and steady tempo',homework:'Practise the C major scale hands separately, five times each.',remarks:'Good progress with finger positioning. Continue slowly before increasing tempo.',events:[{when:'28 Nov 2026 · 4:42 PM',what:'Lesson details recorded',by:'Stephen Lakra'}]},
{id:'LR-1042',student:'Ananya Das',subject:'Vocals',date:'27 Nov 2026',time:'5:00 PM',teacher:'Stephen Lakra',topic:'Breath support and vowel placement',homework:'Practise the five-note warm-up on “ah” and “oo”.',remarks:'',events:[{when:'27 Nov 2026 · 5:38 PM',what:'Lesson details recorded',by:'Stephen Lakra'}]},
{id:'LR-1035',student:'Rohan Ekka',subject:'Guitar',date:'26 Nov 2026',time:'3:30 PM',teacher:'Stephen Lakra',topic:'',homework:'',remarks:'',events:[{when:'26 Nov 2026 · 4:05 PM',what:'Lesson details recorded',by:'Stephen Lakra'}]}
];
let current=null,editing=false,backup=null;
const $=id=>document.getElementById(id);
function renderList(){ $('records').innerHTML=data.map((r,i)=>`<div class="item" data-i="${i}"><div class="date"><b>${r.date.split(' ')[0]}</b>${r.date.split(' ')[1].slice(0,3)}</div><div class="info"><div class="name">${r.student}</div><div class="sub">${r.subject} · ${r.time}</div><div class="topic">${r.topic||'No lesson details recorded'}</div></div><div class="arrow">›</div></div>`).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openRecord(data[+el.dataset.i]));}
function openRecord(r){current=r;editing=false;backup=null;$('title').textContent='Lesson details';$('subtitle').textContent=r.date+' · '+r.time+' · '+r.subject;$('student').textContent=r.student;$('subject').textContent=r.subject;$('date').textContent=r.date+' · '+r.time;$('teacher').textContent=r.teacher;setFields();$('overlay').classList.add('open');$('history').hidden=true;buttons();}
function setFields(){['topic','homework','remarks'].forEach(k=>{$(k).value=current[k]||'';$(k).disabled=!editing;});$('mode').textContent=editing?'Editing':'Saved record';}
function buttons(){$('edit').hidden=editing;$('save').hidden=!editing;$('cancel').hidden=!editing;$('historyBtn').hidden=editing;}
function close(){if(editing&&!confirm('Discard your unsaved changes?'))return;$('overlay').classList.remove('open');editing=false;}
$('close').onclick=close;$('cancel').onclick=()=>{if(!confirm('Discard your changes?'))return;editing=false;setFields();buttons();};$('edit').onclick=()=>{backup={topic:current.topic,homework:current.homework,remarks:current.remarks};editing=true;setFields();buttons();$('topic').focus();};
$('save').onclick=()=>{const changed=['topic','homework','remarks'].filter(k=>(current[k]||'')!==$(k).value.trim());if(!changed.length){editing=false;setFields();buttons();return toast('No changes to save');}changed.forEach(k=>current[k]=$(k).value.trim());current.events.push({when:'Just now',what:'Updated '+changed.map(x=>x==='topic'?'Topic covered':x).join(', '),by:current.teacher});editing=false;setFields();buttons();renderList();toast('Lesson changes saved');};
$('historyBtn').onclick=()=>{const box=$('history');box.hidden=!box.hidden;if(!box.hidden)$('events').innerHTML=current.events.slice().reverse().map(e=>`<div class="event"><b>${e.what}</b><span>${e.when} · ${e.by}</span></div>`).join('');};
$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800);}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open'))close();});renderList();
</script></body></html>
