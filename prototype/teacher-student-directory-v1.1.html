/* Celestial: restrained, familiar app styling */
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .16s,color .16s}
.topbar{height:60px;gap:10px;padding:0 clamp(12px,3vw,28px);backdrop-filter:none;background:var(--nav)}
.brand{font:600 19px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.025em}
.top-divider{height:22px}
.top-title{font:500 17px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}
.saved{border-radius:8px;padding:6px 9px;font-size:11px;font-weight:650}
.icon{border-radius:9px;width:36px;height:36px;transition:background .15s,border-color .15s}
.icon:active{transform:scale(.97)}
.layout{max-width:880px;padding:22px clamp(14px,3vw,28px) 100px}
.class-meta{grid-template-columns:1fr 1fr;gap:12px;background:transparent;border:0;padding:0;border-radius:0;box-shadow:none;margin-bottom:18px}
.fieldbox label{font-size:12px;font-weight:600;letter-spacing:0;margin:0 0 7px;color:var(--muted)}
.fieldbox select,.date-input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 12px;outline:none}
.date-input{font-variant-numeric:tabular-nums}
.fieldbox select:focus,.date-input:focus{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 15%,transparent)}
.summary{gap:8px;margin:0 0 20px}
.stat{border-radius:8px;padding:9px 8px;font-size:12px;font-weight:650}
.list-head{margin:0 1px 9px}
.list-head strong{font-size:15px;font-weight:650}
.hint{font-size:12px}
.student-list{gap:0;border-top:1px solid var(--line)}
.student{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--surface);padding:12px 10px;min-height:68px;gap:10px}
.student:active{transform:none;background:var(--surface2)}
.student.selected{border-color:var(--line);background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.avatar{display:none}
.student-name{font-weight:600;font-size:14px}
.student-sub{font-size:11px;margin-top:2px}
.status{border-radius:8px;min-width:98px;padding:8px 9px;font-size:12px;font-weight:600}
.arrow{font-size:19px}
.check{border-radius:5px}
.bulkbar{border-radius:12px;box-shadow:0 6px 22px #0002;padding:9px}
.action{border-radius:8px;font-size:12px;font-weight:600}
.action.gold{background:var(--gold);color:#fff}
.fab{width:52px;height:52px;border-radius:14px;box-shadow:0 3px 12px #0002;font-size:27px}
.modal-backdrop{background:#0007}
.modal{border-radius:14px;padding:19px;box-shadow:0 12px 40px #0003;transform:translateY(10px)}
.modal h2{font:600 21px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif}
.formrow label{font-size:12px;font-weight:600;letter-spacing:0}
.formrow textarea{border-radius:9px}
.drawer{padding:20px}
.drawer .brand{font-size:19px;margin:4px 0 22px}
.navitem{border-radius:8px;font-size:14px;font-weight:550}
.navitem.active{background:var(--gold-soft);color:var(--ink)}
.footer-note{display:none}
@media(max-width:620px){
 .topbar{height:56px;padding:0 9px;gap:6px}
 .brand{font-size:17px}
 .top-title,.top-divider{display:none}
 .saved{font-size:0;min-width:28px;padding:6px 7px;text-align:center;background:transparent}
 .saved:before{content:"✓";font-size:13px}
 .icon{width:32px;height:34px;flex:0 0 32px}
 .layout{padding:17px 13px 90px}
 .class-meta{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
 .fieldbox label{font-size:11px}
 .fieldbox select,.date-input{min-height:42px;padding:9px 8px;font-size:13px}
 .summary{gap:5px;margin-bottom:17px}
 .stat{font-size:11px;padding:8px 2px}
 .list-head{margin-bottom:7px}
 .student{padding:11px 5px;min-height:64px}
 .student-name{font-size:13px}
 .status{min-width:88px;padding:7px 7px;font-size:11px}.quick-attendance{gap:5px}.quick-mark{width:36px;height:38px}
 .arrow{display:none}
 .hint{font-size:10px}
 .bulkbar{bottom:10px}
 .fab{bottom:15px;right:15px;width:49px;height:49px}
}

.quick-attendance{display:flex;align-items:center;gap:6px;flex:0 0 auto}.quick-mark{width:39px;height:39px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--muted);font-size:14px;font-weight:750;transition:background .16s,color .16s,border-color .16s,transform .12s}.quick-mark:active{transform:scale(.94)}.quick-mark.is-present{background:var(--green-bg);color:var(--green);border-color:color-mix(in srgb,var(--green) 42%,var(--line))}.quick-mark.is-absent{background:var(--red-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 42%,var(--line))}.quick-mark:focus-visible{outline:2px solid var(--focus);outline-offset:2px}


/* Teacher Student Directory — additions to the locked Celestial shell */
.dir-page{padding:8px 0 54px}
.dir-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 20px}
.dir-eyebrow{font-size:10px;letter-spacing:.13em;font-weight:750;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.dir-title{font:30px/1.12 Georgia,serif;letter-spacing:-.02em;margin:0}
.dir-description{font-size:13px;color:var(--muted);margin:7px 0 0;max-width:520px}
.dir-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 21px}
.dir-metric{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;min-width:0}
.dir-metric strong{display:block;font-size:21px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.dir-metric span{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.dir-controls{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:13px}
.dir-search{position:relative}
.dir-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-52%);font-size:23px;color:var(--muted);pointer-events:none;line-height:1}
.dir-search input{width:100%;height:45px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);padding:0 13px 0 42px;outline:none;font-size:13px}
.dir-search input:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.dir-filter-block{margin-top:13px}
.dir-filter-label{display:block;font-size:10px;letter-spacing:.08em;font-weight:750;color:var(--muted);text-transform:uppercase;margin:0 0 8px 1px}
.dir-chip-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dir-chip{border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);padding:7px 11px;font-size:11px;font-weight:650;white-space:nowrap}
.dir-chip[aria-pressed=true]{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,var(--line));color:var(--ink)}
.dir-filter-divider{height:1px;background:var(--line);margin:13px 0}
.dir-roster-note{font-size:11px;color:var(--muted);margin:12px 2px 17px;display:flex;align-items:flex-start;gap:7px}
.dir-roster-note strong{font-weight:650;color:var(--ink)}
.dir-list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 9px}
.dir-list-head strong{font-size:13px;font-weight:700}
.dir-list-head span{font-size:11px;color:var(--muted)}
.dir-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.dir-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:76px;transition:background .15s}
.dir-row:last-child{border-bottom:0}
.dir-row:hover{background:var(--surface2)}
.dir-row:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
.dir-avatar{width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:800}
.dir-person{flex:1;min-width:0}
.dir-person-name{font-size:13px;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir-subjects{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dir-subject-tag{font-size:10px;line-height:1.35;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.dir-row-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.dir-status{font-size:10px;font-weight:700;border-radius:99px;padding:5px 8px;white-space:nowrap}
.dir-status.active{color:var(--green);background:var(--green-bg)}
.dir-status.inactive{color:var(--amber);background:var(--amber-bg)}
.dir-chevron{font-size:20px;color:var(--muted);line-height:1}
.dir-empty{padding:35px 18px;text-align:center;color:var(--muted);font-size:12px}
.dir-empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.dir-clear{margin-top:12px;border:0;background:transparent;color:var(--gold);font-size:12px;font-weight:700;padding:5px}
.dir-footnote{font-size:10px;color:var(--muted);margin:13px 2px 0}
.dir-modal-subjects{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}
.dir-detail-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.dir-detail-row:last-child{border-bottom:0}
.dir-detail-row span:first-child{color:var(--muted)}
.dir-subject-option{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
.dir-subject-option:last-child{border-bottom:0}
.dir-subject-option input{accent-color:var(--gold);width:16px;height:16px}
.dir-form-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface2);color:var(--ink);outline:none;font-size:13px}
.dir-form-input:focus{border-color:var(--focus)}
.dir-help{font-size:10px;color:var(--muted);margin-top:6px}
.dir-add-button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:11px;font-weight:700}
.dir-add-button:hover{background:var(--surface2)}
.navitem.active{background:var(--gold-soft);color:var(--ink)}
@media(max-width:600px){
 .dir-page{padding-top:3px}
 .dir-heading{align-items:flex-start;margin-bottom:16px}
 .dir-title{font-size:27px}
 .dir-description{font-size:12px}
 .dir-metrics{gap:7px;margin-bottom:15px}
 .dir-metric{padding:11px 10px;border-radius:11px}
 .dir-metric strong{font-size:19px}
 .dir-metric span{font-size:10px}
 .dir-controls{padding:11px;border-radius:13px}
 .dir-row{padding:12px 10px;gap:9px;min-height:70px}
 .dir-avatar{width:35px;height:35px;flex-basis:35px}
 .dir-row-side{gap:6px}
 .dir-status{font-size:9px;padding:5px 7px}
}

  <header class="topbar">
    <button class="icon" aria-label="Open menu" onclick="toggleMenu()">☰</button>
    <div class="brand">Celestial</div>

    <div class="top-title" id="topTitle">My Students</div>

    <span class="saved" id="saveState">✓ Saved</span>
    <button class="icon" id="undoBtn" title="Undo directory change" aria-label="Undo directory change" onclick="undo()">↶</button>
    <button class="icon" id="redoBtn" title="Redo directory change" aria-label="Redo directory change" onclick="redo()">↷</button>
    <button class="icon theme-toggle" id="themeBtn" title="Switch theme" aria-label="Switch theme" onclick="cycleTheme()">☾</button>
  </header>
  <main class="layout"><div id="screen" class="page"></div></main>
  <div class="bulkbar" id="bulkbar"></div>
  <button class="fab" id="fab" onclick="addStudent()" aria-label="Add student">＋</button>
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div>
  <div class="menu" id="menu" onclick="if(event.target===this)toggleMenu(false)">
    <aside class="drawer">
      <div class="brand">Celestial</div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:750;margin:24px 12px 8px">TEACHER WORKSPACE</div>
      <button class="navitem" onclick="openReference('prototype/class-register.html')">▤ &nbsp; Class Register</button>
      <button class="navitem active" onclick="toggleMenu(false)">♙ &nbsp; My Students</button>
      <button class="navitem" onclick="openReference('prototype/history-v1.2.html')">◷ &nbsp; History</button>
      <button class="navitem" onclick="showPreferences()">⚙ &nbsp; Account & Preferences</button>
      <div style="font-size:10px;color:var(--muted);line-height:1.55;margin:24px 12px 0">Student records shown here are illustrative prototype data. Access to real records must be restricted by the signed-in teacher's permissions.</div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>


const DIRECTORY_KEY = 'celestial-directory-v1-demo';
const REPO_ROOT = 'https://github.com/steph1420/Celestial-Music-Classes/blob/main/';
const seedStudents = [
  {id:'STU-0001',name:'Aarav Sharma',status:'Active',enrolments:[{subject:'Piano',status:'Active'}]},
  {id:'STU-0002',name:'Ananya Das',status:'Active',enrolments:[{subject:'Piano',status:'Active'},{subject:'Vocals',status:'Active'}]},
  {id:'STU-0003',name:'Misha Singh',status:'Active',enrolments:[{subject:'Piano',status:'Active'}]},
  {id:'STU-0004',name:'Rohan Kumar',status:'Active',enrolments:[{subject:'Piano',status:'Active'},{subject:'Guitar',status:'Active'}]},
  {id:'STU-0005',name:'Ishita Roy',status:'Active',enrolments:[{subject:'Vocals',status:'Active'}]},
  {id:'STU-0006',name:'Kabir Ali',status:'Inactive',enrolments:[{subject:'Guitar',status:'Inactive'}]},
  {id:'STU-0007',name:'Tara Dutta',status:'Active',enrolments:[{subject:'Piano',status:'Active'},{subject:'Vocals',status:'Active'}]},
  {id:'STU-0008',name:'Vivaan Roy',status:'Active',enrolments:[{subject:'Guitar',status:'Active'}]}
];
let state = loadDirectory();
let query = '';
let subjectFilter = 'All';
let statusFilter = 'Active';
let themePref = state.theme || 'light';
let undoStack = [];
let redoStack = [];
let toastTimer = null;

function stableStudentId(value,index){
  const raw=String(value||'');
  if(/^STU-\\d{4,}$/i.test(raw)) return raw.toUpperCase();
  const digits=raw.match(/\\d+/);
  const number=digits?Number(digits[0]):index+1;
  return 'STU-'+String(number).padStart(4,'0');
}
function normaliseStudentIds(students){
  const used=new Set();
  return students.map((student,index)=>{
    let id=stableStudentId(student.id,index);
    let number=Number(id.slice(4));
    while(used.has(id)){number++;id='STU-'+String(number).padStart(4,'0')}
    used.add(id);
    return {...student,id:id};
  });
}
function loadDirectory(){
  try{
    const saved = JSON.parse(localStorage.getItem(DIRECTORY_KEY) || 'null');
    if(saved && Array.isArray(saved.students)){
      return {students:normaliseStudentIds(saved.students),theme:saved.theme || 'light'};
    }
  }catch(e){}
  return {students:normaliseStudentIds(structuredClone(seedStudents)),theme:'light'};
}
function esc(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  return String(name || '').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
}
function persist(){
  const save = document.getElementById('saveState');
  save.textContent = 'Saving…';
  try{
    localStorage.setItem(DIRECTORY_KEY,JSON.stringify(state));
    window.setTimeout(()=>{save.textContent='✓ Saved'},180);
  }catch(e){
    save.textContent = 'Local only';
    toast('Browser storage is unavailable; changes may not persist.');
  }
}
function snapshot(){ return JSON.stringify(state.students); }
function commitDirectory(label,before){
  undoStack.push({label:label,before:before,after:snapshot()});
  if(undoStack.length>50) undoStack.shift();
  redoStack = [];
  persist();
  updateHistoryButtons();
}
function updateHistoryButtons(){
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;
}
function undo(){
  if(!undoStack.length) return;
  const item = undoStack.pop();
  redoStack.push({label:item.label,before:item.before,after:snapshot()});
  state.students = JSON.parse(item.before);
  persist(); updateHistoryButtons(); renderDirectory();
  toast('Undid: ' + item.label);
}
function redo(){
  if(!redoStack.length) return;
  const item = redoStack.pop();
  undoStack.push({label:item.label,before:snapshot(),after:item.after});
  state.students = JSON.parse(item.after);
  persist(); updateHistoryButtons(); renderDirectory();
  toast('Redid: ' + item.label);
}
function toast(message){
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = window.setTimeout(()=>el.classList.remove('show'),2100);
}
function applyTheme(){
  const resolved = themePref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : themePref;
  document.documentElement.dataset.theme = resolved;
  document.getElementById('themeBtn').textContent = themePref === 'dark' ? '☀' : themePref === 'light' ? '☾' : '◐';
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
function cycleTheme(){
  themePref = themePref === 'light' ? 'dark' : themePref === 'dark' ? 'system' : 'light';
  state.theme = themePref; persist(); applyTheme();
  toast('Theme: ' + themePref[0].toUpperCase() + themePref.slice(1));
}
function toggleMenu(force){
  const el = document.getElementById('menu');
  if(force === false) el.classList.remove('open'); else el.classList.toggle('open');
}
function openReference(relativePath){
  toggleMenu(false);
  const root = 'https://steph1420.github.io/Celestial-Music-Classes/';
  const target = relativePath.includes('class-register.html')
    ? root + 'prototype/class-register.html?v=navfix-20261127'
    : relativePath.includes('history-v1.2.html')
      ? root + 'prototype/history-v1.2.html?v=navfix-20261127'
      : root;
  window.location.href = target;
}
function showPreferences(){
  toggleMenu(false);
  const options = ['light','dark','system'].map(value =>
    '<label class="dir-subject-option"><input type="radio" name="dirTheme" value="' + value + '" ' + (themePref===value?'checked':'') + ' onchange="setThemePreference(this.value)"><span>' + value.charAt(0).toUpperCase()+value.slice(1) + '</span></label>'
  ).join('');
  showModal('Appearance', '<p class="hint">Choose how the Celestial workspace appears on this device.</p><div style="margin-top:10px">' + options + '</div>', '<button class="action" onclick="closeModal()">Done</button>');
}
function setThemePreference(value){
  themePref = value; state.theme = value; persist(); applyTheme();
}
function showModal(title,content,actions){
  document.getElementById('modal').innerHTML =
    '<div class="modal-head"><div><h2>' + esc(title) + '</h2></div><button class="icon close" aria-label="Close" onclick="closeModal()">×</button></div>' +
    content + '<div class="modal-actions">' + (actions || '') + '</div>';
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
function setQuery(value){ query = value; renderList(); }
function setSubjectFilter(value){ subjectFilter = value; renderDirectory(); }
function setStatusFilter(value){ statusFilter = value; renderDirectory(); }
function matchesStudent(student){
  const nameMatch = student.name.toLowerCase().includes(query.trim().toLowerCase());
  const subjectMatch = subjectFilter === 'All' || student.enrolments.some(e=>e.subject===subjectFilter);
  const statusMatch = statusFilter === 'All' || student.status === statusFilter;
  return nameMatch && subjectMatch && statusMatch;
}
function renderDirectory(){
  applyTheme();
  document.getElementById('topTitle').textContent = 'My Students';
  const activeCount = state.students.filter(s=>s.status==='Active').length;
  const subjects = new Set(state.students.flatMap(s=>s.enrolments.map(e=>e.subject)));
  const screen = document.getElementById('screen');
  screen.innerHTML =
    '<section class="dir-page">' +
      '<div class="dir-heading"><div><div class="dir-eyebrow">Teacher workspace</div><h1 class="dir-title">My Students</h1><p class="dir-description">Your student roster, organised across the subjects you teach.</p></div></div>' +
      '<div class="dir-metrics">' +
        '<div class="dir-metric"><strong>' + state.students.length + '</strong><span>Students in roster</span></div>' +
        '<div class="dir-metric"><strong>' + activeCount + '</strong><span>Active students</span></div>' +
        '<div class="dir-metric"><strong>' + subjects.size + '</strong><span>Subjects represented</span></div>' +
      '</div>' +
      '<section class="dir-controls" aria-label="Search and filter students">' +
        '<label class="dir-search"><span class="dir-search-icon" aria-hidden="true">⌕</span><input id="studentSearch" type="search" placeholder="Search by student name…" autocomplete="off" value="' + esc(query) + '" oninput="setQuery(this.value)" aria-label="Search students by name"></label>' +
        '<div class="dir-filter-block"><span class="dir-filter-label">Subject</span><div class="dir-chip-row">' +
          ['All','Piano','Vocals','Guitar'].map(value=>'<button class="dir-chip" data-subject="' + esc(value) + '" aria-pressed="' + (subjectFilter===value) + '" onclick="setSubjectFilter(this.dataset.subject)">' + (value==='All'?'All subjects':value) + '</button>').join('') +
        '</div></div>' +
        '<div class="dir-filter-divider"></div>' +
        '<div class="dir-filter-block"><span class="dir-filter-label">Student status</span><div class="dir-chip-row">' +
          ['Active','All','Inactive'].map(value=>'<button class="dir-chip" data-status="' + esc(value) + '" aria-pressed="' + (statusFilter===value) + '" onclick="setStatusFilter(this.dataset.status)">' + (value==='All'?'All students':value) + '</button>').join('') +
        '</div></div>' +
      '</section>' +
      '<p class="dir-roster-note"><span aria-hidden="true">ⓘ</span><span><strong>One student, one record.</strong> A student enrolled in multiple subjects still appears only once in this directory.</span></p>' +
      '<div class="dir-list-head"><strong>Student list</strong><span id="resultCount"></span></div>' +
      '<div id="studentList"></div>' +
      '<p class="dir-footnote">Illustrative teacher roster · Changes are saved in this browser only.</p>' +
    '</section>';
  renderList();
}
function renderList(){
  const list = state.students.filter(matchesStudent).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('resultCount').textContent = list.length + (list.length===1?' student':' students');
  const holder = document.getElementById('studentList');
  if(!list.length){
    holder.innerHTML = '<div class="dir-list"><div class="dir-empty"><strong>No students found</strong>Try a different name or remove one of the filters.<br><button class="dir-clear" onclick="clearFilters()">Clear all filters</button></div></div>';
    return;
  }
  holder.innerHTML = '<div class="dir-list">' + list.map(student=>{
    const tags = student.enrolments.map(e=>'<span class="dir-subject-tag">' + esc(e.subject) + '</span>').join('');
    return '<button class="dir-row" type="button" data-id="' + esc(student.id) + '" onclick="showStudent(this.dataset.id)" aria-label="View ' + esc(student.name) + '">' +
      '<span class="dir-avatar" aria-hidden="true">' + esc(initials(student.name)) + '</span>' +
      '<span class="dir-person"><span class="dir-person-name">' + esc(student.name) + '</span><span class="dir-subjects">' + tags + '</span></span>' +
      '<span class="dir-row-side"><span class="dir-status ' + (student.status==='Active'?'active':'inactive') + '">' + esc(student.status) + '</span><span class="dir-chevron" aria-hidden="true">›</span></span>' +
    '</button>';
  }).join('') + '</div>';
}
function clearFilters(){
  query = ''; subjectFilter = 'All'; statusFilter = 'Active'; renderDirectory();
}
function showStudent(id){
  const student = state.students.find(s=>s.id===id);
  if(!student) return;
  const subjects = student.enrolments.map(e=>'<span class="dir-subject-tag">' + esc(e.subject) + '</span>').join('');
  const content =
    '<div class="dir-detail-row"><span>Student ID</span><strong>' + esc(student.id) + '</strong></div>' +
    '<div class="dir-detail-row"><span>Student name</span><strong>' + esc(student.name) + '</strong></div>' +
    '<div class="dir-detail-row"><span>Record status</span><strong>' + esc(student.status) + '</strong></div>' +
    '<div style="padding-top:13px"><span class="dir-filter-label">Subject enrolments</span><div class="dir-modal-subjects">' + subjects + '</div></div>';
  showModal('Student overview',content,
    '<button class="action" onclick="closeModal()">Close</button>' +
    '<button class="action gold" onclick="openFullProfile(\\'' + esc(student.id) + '\\')">Open full student profile →</button>');
}
function openFullProfile(id){
  const selected=state.students.find(item=>item.id===id);
  if(!selected){toast('Student record not found.');return}
  closeModal();
  const url='https://steph1420.github.io/Celestial-Music-Classes/student-profile.html?studentId='+encodeURIComponent(selected.id)+'&v=profile-link-20261127';
  window.location.href=url;
}
function addStudent(){
  const subjects = ['Piano','Vocals','Guitar'].map(value=>
    '<label class="dir-subject-option"><input type="checkbox" name="newSubject" value="' + value + '"><span>' + value + '</span></label>'
  ).join('');
  const content =
    '<form id="addStudentForm" onsubmit="saveNewStudent(event)">' +
      '<div class="formrow"><label for="newStudentName">STUDENT NAME</label><input class="dir-form-input" id="newStudentName" name="name" maxlength="80" required placeholder="Enter full name"></div>' +
      '<div class="formrow"><label>SUBJECT ENROLMENTS</label>' + subjects + '<div class="dir-help">Select every subject this student is enrolled in.</div></div>' +
      '<div class="formrow"><label for="newStudentStatus">RECORD STATUS</label><select class="dir-form-input" id="newStudentStatus"><option>Active</option><option>Inactive</option></select></div>' +
      '<div class="modal-actions"><button type="button" class="action" onclick="closeModal()">Cancel</button><button type="submit" class="action gold">Add student</button></div>' +
    '</form>';
  showModal('Add a student',content,'');
  window.setTimeout(()=>document.getElementById('newStudentName').focus(),80);
}
function saveNewStudent(event){
  event.preventDefault();
  const name = document.getElementById('newStudentName').value.trim();
  const chosen = Array.from(document.querySelectorAll('input[name="newSubject"]:checked')).map(input=>input.value);
  const status = document.getElementById('newStudentStatus').value;
  if(!name){ toast('Enter the student’s name.'); return; }
  if(!chosen.length){ toast('Select at least one subject.'); return; }
  if(state.students.some(s=>s.name.toLocaleLowerCase()===name.toLocaleLowerCase())){ toast('A student with this name is already listed.'); return; }
  const before = snapshot();
  const number = state.students.reduce((max,s)=>Math.max(max,Number(String(s.id).replace(/\D/g,''))||0),0)+1;
  const studentId='STU-'+String(number).padStart(4,'0');
  state.students.push({id:studentId,name:name,status:status,enrolments:chosen.map(subject=>({subject:subject,status:status}))});
  commitDirectory('Add student · ' + name,before);
  closeModal(); renderDirectory(); toast('Student added to this demo roster.');
}
function showModalPreferencesFallback(){}
function openKeyboardShortcuts(){}
function back(){
  if(document.getElementById('modalBackdrop').classList.contains('open')){closeModal();return;}
  if(document.getElementById('menu').classList.contains('open')){toggleMenu(false);return;}
  toast('You are at the Student Directory screen.');
}
window.addEventListener('keydown',event=>{if(event.key==='Escape')back();if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();event.shiftKey?redo():undo();}});
document.getElementById('fab').style.display = 'grid';
applyTheme();
renderDirectory();
updateHistoryButtons();


</script></body></html>
